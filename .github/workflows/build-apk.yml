name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/*.apk output_apk/Nexa-Messenger.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Messenger-APK
          path: output_apk/Nexa-Messenger.apk

      - name: Create Direct Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Nexa Messenger APK (Latest Build)"
          body: "Direct download link for Nexa Messenger Native Android APK."
          files: output_apk/Nexa-Messenger.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
