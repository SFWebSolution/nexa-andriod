plugins {
    id 'com.android.application'
}

// Apply the Google Services plugin ONLY when google-services.json is present.
// That file is a secret and is NOT committed (this repo is public); CI writes it
// from the GOOGLE_SERVICES_JSON secret before building. Without the file the app
// still compiles — Firebase.initializeApp() just fails and push is skipped.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.nexa.messenger'
    compileSdk 34

    defaultConfig {
        applicationId "com.nexa.messenger"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Guarantee BuildConfig.VERSION_NAME exists (the JS bridge reports it).
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'

    // Firebase Cloud Messaging — native push. Firebase Android BoM keeps the
    // FCM/messaging versions aligned.
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-messaging'
}
